name: Feature Request
description: Suggest a new command or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like sslx to do?
      placeholder: Describe the feature or the openssl command you want replaced
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      placeholder: How would you use this?
    validations:
      required: false
